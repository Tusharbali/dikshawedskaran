<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" role="img" aria-label="Lord Ganesha">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e8b4"/>
      <stop offset=".5" stop-color="#d4ae5f"/>
      <stop offset="1" stop-color="#9a763c"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dfaa"/>
      <stop offset="1" stop-color="#b08d57"/>
    </linearGradient>
    <path id="ear" d="M72 70 C44 48 12 62 12 100 C12 138 40 160 72 138 C60 118 60 92 72 70 Z"/>
    <path id="earIn" d="M64 78 C44 66 26 76 26 100 C26 124 44 138 62 126 C54 112 54 94 64 78 Z"/>
  </defs>
  <g stroke="#5a0816" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <!-- ears -->
    <use href="#ear" fill="url(#g)"/>
    <use href="#earIn" fill="url(#g2)" stroke-width="1.5"/>
    <g transform="translate(200,0) scale(-1,1)">
      <use href="#ear" fill="url(#g)"/>
      <use href="#earIn" fill="url(#g2)" stroke-width="1.5"/>
    </g>
    <!-- crown -->
    <path d="M66 56 L70 34 Q78 26 85 36 L90 16 Q100 4 110 16 L115 36 Q122 26 130 34 L134 56 Q100 46 66 56 Z" fill="url(#g)"/>
    <circle cx="100" cy="30" r="5" fill="#a1122a"/>
    <circle cx="78" cy="42" r="3" fill="#a1122a"/>
    <circle cx="122" cy="42" r="3" fill="#a1122a"/>
    <path d="M70 54 Q100 44 130 54" fill="none"/>
    <!-- head -->
    <path d="M70 56 Q100 44 130 56 C140 80 136 106 122 124 Q100 132 78 124 C64 106 60 80 70 56 Z" fill="url(#g)"/>
    <!-- tilak -->
    <path d="M91 64 Q91 80 100 82 Q109 80 109 64" fill="none" stroke="#a1122a" stroke-width="3"/>
    <path d="M100 62 V80" fill="none" stroke="#a1122a" stroke-width="3"/>
    <!-- brows + eyes -->
    <path d="M70 86 Q80 80 92 86" fill="none" stroke-width="2.4"/>
    <path d="M108 86 Q120 80 130 86" fill="none" stroke-width="2.4"/>
    <path d="M74 94 Q82 100 90 94" fill="none" stroke-width="3"/>
    <path d="M110 94 Q118 100 126 94" fill="none" stroke-width="3"/>
    <!-- tusks -->
    <path d="M118 120 C134 124 140 140 132 152 C130 146 124 142 118 142" fill="#fff6dc"/>
    <path d="M82 122 C74 126 70 134 72 142 C76 138 80 138 84 138" fill="#fff6dc"/>
    <!-- trunk -->
    <path d="M100 98 C112 108 112 132 106 150 C100 168 82 176 70 168 C58 160 62 144 76 146" fill="none" stroke="#5a0816" stroke-width="26"/>
    <path d="M100 98 C112 108 112 132 106 150 C100 168 82 176 70 168 C58 160 62 144 76 146" fill="none" stroke="url(#g)" stroke-width="22"/>
    <g fill="none" stroke="#9a763c" stroke-width="1.6">
      <path d="M94 116 Q104 120 112 114"/>
      <path d="M95 130 Q104 134 112 128"/>
      <path d="M92 144 Q102 148 108 142"/>
    </g>
    <!-- ornament necklace -->
    <path d="M62 170 Q100 196 138 170" fill="none" stroke="url(#g2)" stroke-width="5"/>
    <circle cx="100" cy="188" r="6" fill="#a1122a" stroke="#f3dfaa" stroke-width="2"/>
  </g>
</svg>
